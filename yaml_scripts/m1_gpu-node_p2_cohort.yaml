                    n_done=$((n_done+1)); continue
                  fi
                  EXTRA_ARGS=()
                  # 2026-05-16: bash glob *_arditi matches BOTH hp_lora_arditi
                  # AND hp_lora_no_arditi (since "_no_arditi" also ends in
                  # "_arditi"). Use explicit case to disambiguate, matching
                  # the layerwise_6mode_probe.py wants_arditi membership test.
                  case "${mode}" in
                    hp_lora_arditi|zero_delta_arditi|vanilla_arditi)
                      EXTRA_ARGS+=( --arditi_patch "${ARDITI_TMP}" \
                                    --arditi_mode "${ARDITI_MODE}" \
                                    --arditi_alpha "${ARDITI_ALPHA}" \
                                    --arditi_layers "${ARDITI_LAYERS}" \
                                    --arditi_label_csv_dir /tmp )
                      ;;
                    *)
                      # Even when Arditi is OFF we still want the directions file
                      # available so the per-probe-dim axis comes from the saved
                      # main/<L> rather than from a synthetic cohort centroid.
                      EXTRA_ARGS+=( --arditi_patch "${ARDITI_TMP}" )
                      ;;
                  esac
                  if [[ "${mode}" == hp_lora_* || "${mode}" == zero_delta_* ]]; then
                    EXTRA_ARGS+=( --hyper_dir "${HYPER_DIR}" )
                  fi
                  if [[ "${mode}" == vanilla_* ]]; then
                    if [[ ! -d "${VANILLA_LORA_DIR}" ]]; then
                      echo "[phase4] vanilla LoRA dir missing; skipping ${mode}"
                      continue
                    fi
                    EXTRA_ARGS+=( --vanilla_lora_dir "${VANILLA_LORA_DIR}" )
                  fi
                  if python "${SCRIPTS}/layerwise_6mode_probe.py" \
                      --mode "${mode}" \
                      --base_model "${BASE_MODEL}" \
                      --target_modules "${TARGET_MODULES}" \
                      --lora_r "${LORA_R}" --lora_alpha "${LORA_ALPHA}" --lora_dropout "${LORA_DROPOUT}" \
                      --inject_clamp "${INJECT_CLAMP}" --delta_gain "${DELTA_GAIN}" \
                      --use_best_ckpt --online \
                      --author_parquet /tmp/author_static_10000.parquet \
                      --labels_csv /tmp/labels_sentiment_goemo.csv \
                      --users_per_cohort 200 \
                      --cohorts "rage,empath" \
