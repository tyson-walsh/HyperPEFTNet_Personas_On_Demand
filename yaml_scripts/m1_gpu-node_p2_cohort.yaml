                  set +e
                  FORUM_ROOT="${FORUM_ROOT}" LAYERWISE_OUT="${LAYERWISE_OUT}" \
                  COHORT_OUT="${COHORT_OUT}" python - <<'PY_TABLE1'
              import json
              import os
              import math
              from pathlib import Path
              import numpy as np
              import pandas as pd

              forum_root  = Path(os.environ["FORUM_ROOT"])
              lw_root     = Path(os.environ["LAYERWISE_OUT"])
              out_dir     = Path(os.environ["COHORT_OUT"])
              out_dir.mkdir(parents=True, exist_ok=True)

              MODES = ["hp_lora_arditi", "hp_lora_no_arditi",
                       "zero_delta_arditi", "zero_delta_no_arditi",
                       "vanilla_arditi", "vanilla_no_arditi"]
              MODE_TO_LABEL = {
                  "hp_lora_arditi":       "M1",
                  "hp_lora_no_arditi":    "M2",
                  "zero_delta_arditi":    "M3",
                  "zero_delta_no_arditi": "M4",
                  "vanilla_arditi":       "M5",
                  "vanilla_no_arditi":    "M6",
              }
              PROBE_DIMS = ["sentiment_goemo", "politeness", "self_focus", "curiosity",
                            "expressiveness", "tempo", "anxiety", "warmth", "hostility"]

              # SIGNED HEDGES' g CONVENTION (locked 2026-05-16):
              #   g > 0  ⇒  cohort effect is in the CORRECT a-priori direction
              #   g < 0  ⇒  WRONG direction (anomaly)
              #   g ≈ 0  ⇒  flat (no cohort signal)
              # Single source of truth: training_scripts/signed_hedges_g.py.
              # HIGH_COHORT_PER_MEASURE there names which cohort tail should
              # score higher on each measure; signed_g_table returns (HIGH - LOW)
              # with Hedges bias correction. Two known wrong-direction flags from
              # the smoke battery on the production HP-LoRA+Arditi cell: tempo
              # (no strong a-priori cohort theory) and warmth (data anomaly
              # worth investigating). The convention itself is right; the
              # expected-direction map for those two may need a second pass.
              import sys as _sys
              _sys.path.insert(0, "/workspace/hypernets/training_scripts")
              from signed_hedges_g import (
                  HIGH_COHORT_PER_MEASURE,
                  _hedges_g as _signed_hedges_g_internal,
              )

              def signed_g_per_user(r_per_user, e_per_user, measure):
                  """Signed Hedges' g rage-vs-empath at the per-user level.
                  g > 0 means correct cohort direction per HIGH_COHORT_PER_MEASURE."""
                  high = HIGH_COHORT_PER_MEASURE.get(measure)
                  if high == "empath":
                      return _signed_hedges_g_internal(e_per_user, r_per_user)
                  elif high == "rage":
                      return _signed_hedges_g_internal(r_per_user, e_per_user)
                  return float("nan")

              # ----- (1) Surface table -----
              surface = {dim: {} for dim in PROBE_DIMS}
              raw_surface = {dim: {} for dim in PROBE_DIMS}  # also keep raw for reference
              per_mode_n = {}
              per_mode_coherent = {}
              for mode in MODES:
                  rage_dir = forum_root / f"2_cohort_{mode}_rage" / "persona_signature" / "persona_signature.parquet"
                  empa_dir = forum_root / f"2_cohort_{mode}_empath" / "persona_signature" / "persona_signature.parquet"
                  if not rage_dir.exists() or not empa_dir.exists():
                      print(f"[surface] missing signature for {mode}: rage={rage_dir.exists()} empa={empa_dir.exists()}")
                      for dim in PROBE_DIMS:
                          surface[dim][MODE_TO_LABEL[mode]] = float("nan")
                          raw_surface[dim][MODE_TO_LABEL[mode]] = float("nan")
                      continue
                  try:
                      df_r = pd.read_parquet(rage_dir)
                      df_e = pd.read_parquet(empa_dir)
                  except Exception as ex:
                      print(f"[surface] read failed {mode}: {ex}")
                      for dim in PROBE_DIMS:
                          surface[dim][MODE_TO_LABEL[mode]] = float("nan")
                          raw_surface[dim][MODE_TO_LABEL[mode]] = float("nan")
                      continue
                  per_mode_n[mode] = (int(len(df_r)), int(len(df_e)))
                  # Coherence rate proxy: mean of is_coherent if present
                  cr = float("nan"); ce = float("nan")
                  for col in ("is_coherent", "coherent"):
                      if col in df_r.columns:
                          cr = float(pd.to_numeric(df_r[col], errors="coerce").mean())
                      if col in df_e.columns:
                          ce = float(pd.to_numeric(df_e[col], errors="coerce").mean())
                  per_mode_coherent[mode] = {"rage": cr, "empath": ce}
                  # 2026-05-16: bug fix -- filter by expected_cohort_goemo,
                  # NOT by which cell (rage_dir vs empa_dir). The rage CELL
                  # contains posts from BOTH rage and empath users discussing
                  # the rage topic; the empath CELL contains posts from BOTH
                  # rage and empath users discussing the empath topic. Comparing
                  # "all users in rage cell" vs "all users in empath cell" mixes
                  # a cohort effect with a topic effect and gives the wrong g.
                  # The right comparison is: rage USERS vs empath USERS, pooled
                  # across cells, OR cohort-filtered within each cell. We pool:
                  # rage users from both cells vs empath users from both cells.
                  # Per-user mean realized_pol_<dim>; SIGNED g via signed_hedges_g convention
                  if ("expected_cohort_goemo" not in df_r.columns
                          or "expected_cohort_goemo" not in df_e.columns):
                      print(f"[surface] {mode}: signature parquet missing expected_cohort_goemo; "
                            f"falling back to cell-vs-cell (mixes topic + cohort effects)")
                      use_cohort_filter = False
                  else:
                      use_cohort_filter = True
                  for dim in PROBE_DIMS:
                      col = f"realized_pol_{dim}"
                      if col not in df_r.columns or col not in df_e.columns:
                          surface[dim][MODE_TO_LABEL[mode]] = float("nan")
                          raw_surface[dim][MODE_TO_LABEL[mode]] = float("nan")
                          continue
                      if use_cohort_filter:
                          # Pool: rage users from BOTH cells, empath users from BOTH cells.
                          rage_rows = pd.concat([
                              df_r[df_r["expected_cohort_goemo"] == "rage"],
                              df_e[df_e["expected_cohort_goemo"] == "rage"],
                          ], ignore_index=True)
                          empa_rows = pd.concat([
                              df_r[df_r["expected_cohort_goemo"] == "empath"],
                              df_e[df_e["expected_cohort_goemo"] == "empath"],
                          ], ignore_index=True)
                      else:
                          rage_rows = df_r
                          empa_rows = df_e
                      r_per_user = rage_rows.groupby("author_user_id")[col].mean().to_numpy() \
                          if "author_user_id" in rage_rows.columns else rage_rows[col].to_numpy()
                      e_per_user = empa_rows.groupby("author_user_id")[col].mean().to_numpy() \
                          if "author_user_id" in empa_rows.columns else empa_rows[col].to_numpy()
                      r_per_user = r_per_user[np.isfinite(r_per_user)]
                      e_per_user = e_per_user[np.isfinite(e_per_user)]
                      surface[dim][MODE_TO_LABEL[mode]] = signed_g_per_user(r_per_user, e_per_user, dim)
                      # Also raw (rage − empath) for reference
                      raw_surface[dim][MODE_TO_LABEL[mode]] = _signed_hedges_g_internal(r_per_user, e_per_user)

              surf_df = pd.DataFrame(
                  index=PROBE_DIMS,
                  columns=[MODE_TO_LABEL[m] for m in MODES],
                  data=[[surface[d].get(MODE_TO_LABEL[m], float("nan")) for m in MODES] for d in PROBE_DIMS],
              )
              surf_df.index.name = "probe_dim"
              surf_csv = out_dir / "surface_table1.csv"
              surf_df.to_csv(surf_csv)
              print(f"[surface] wrote {surf_csv}")

              # ----- (2) Layerwise table -----
              lw_rows = []
              for mode in MODES:
                  p = lw_root / f"layerwise_probe_{mode}.parquet"
                  if not p.exists():
                      print(f"[layerwise] missing {p}")
                      continue
                  d = pd.read_parquet(p)
                  d = d.assign(mode=MODE_TO_LABEL[mode])
                  lw_rows.append(d)
              if lw_rows:
                  all_lw = pd.concat(lw_rows, ignore_index=True)
                  # Filter to the 9 probe dims (drop cohort_axis if present)
                  lw_f = all_lw[all_lw["probe_dim"].isin(PROBE_DIMS)].copy()
                  # Apply SIGNED g convention: g_value from probe is raw (rage − empath).
                  # Flip sign so + = correct direction per HIGH_COHORT_PER_MEASURE.
                  def _sign_flip(row):
                      high = HIGH_COHORT_PER_MEASURE.get(row["probe_dim"])
                      v = row["g_value"]
                      if v is None or (isinstance(v, float) and not np.isfinite(v)):
                          return v
                      # raw is rage − empath. If HIGH=rage, raw IS already correct.
                      # If HIGH=empath, flip sign so empath-higher gives +.
                      return float(v) if high == "rage" else (-float(v) if high == "empath" else float("nan"))
                  lw_f["g_signed"] = lw_f.apply(_sign_flip, axis=1)
                  lw_f["g_raw"] = lw_f["g_value"]
                  pivot = lw_f.pivot_table(
                      index=["layer", "probe_dim"],
                      columns="mode", values="g_signed", aggfunc="first",
                  ).reset_index().sort_values(["layer", "probe_dim"])
                  lw_csv = out_dir / "layerwise_table1.csv"
                  pivot.to_csv(lw_csv, index=False)
                  # Also keep raw version side-by-side for any debug needs
                  pivot_raw = lw_f.pivot_table(
                      index=["layer", "probe_dim"],
                      columns="mode", values="g_raw", aggfunc="first",
                  ).reset_index().sort_values(["layer", "probe_dim"])
                  pivot_raw.to_csv(out_dir / "layerwise_table1_raw.csv", index=False)
                  print(f"[layerwise] wrote {lw_csv}  rows={len(pivot)} (signed; raw companion also written)")
              else:
                  pivot = pd.DataFrame()
                  print("[layerwise] no layerwise rows produced")

              # Also write the raw rage−empath surface for reference
              raw_surf_df = pd.DataFrame(
                  index=PROBE_DIMS,
                  columns=[MODE_TO_LABEL[m] for m in MODES],
                  data=[[raw_surface[d].get(MODE_TO_LABEL[m], float("nan")) for m in MODES] for d in PROBE_DIMS],
              )
              raw_surf_df.index.name = "probe_dim"
              raw_surf_df.to_csv(out_dir / "surface_table1_raw.csv")

              # ----- (3) Combined JSON pack -----
              pack = {
                  "modes": {MODE_TO_LABEL[m]: m for m in MODES},
                  "convention": "g > 0 = CORRECT direction per HIGH_COHORT_PER_MEASURE; g < 0 = WRONG; ≈0 = flat",
                  "high_cohort_per_measure": HIGH_COHORT_PER_MEASURE,
                  "surface_table1_csv": str(surf_csv),
                  "surface_table1_raw_csv": str(out_dir / "surface_table1_raw.csv"),
                  "layerwise_table1_csv": str((out_dir / "layerwise_table1.csv")) if not pivot.empty else None,
                  "layerwise_table1_raw_csv": str(out_dir / "layerwise_table1_raw.csv") if not pivot.empty else None,
                  "per_mode_n_rows": {MODE_TO_LABEL[m]: per_mode_n.get(m) for m in MODES},
                  "per_mode_coherent_frac": {MODE_TO_LABEL[m]: per_mode_coherent.get(m) for m in MODES},
                  "surface": {d: surface[d] for d in PROBE_DIMS},
                  "caveats": [
                      "tempo and warmth came out wrong-direction (−) on production smoke; "
                      "either the expected-direction map needs a second pass for those two, "
                      "or the data is reporting a real anomaly worth investigating."
                  ],
              }
              pack_p = out_dir / "paper2_cohort_analysis_pack.json"
              pack_p.write_text(json.dumps(pack, indent=2, default=str))
              print(f"[pack] wrote {pack_p}")

              # ----- (4) Cohort-centroid-distance pivot (non-NaN comparator) -----
              # 2026-05-16: cohort-centroid-distance non-NaN baseline comparator.
              # Same shape as layerwise_table1 but on cohort_centroid_dist
              # instead of g_value. Lets us read Arditi cohort-mean shifts in
              # zero_delta + vanilla modes where per-user g is correctly NaN.
              cd_pivot = pd.DataFrame()
              if lw_rows:
                  if "cohort_centroid_dist" in all_lw.columns:
                      lw_cd = all_lw[all_lw["probe_dim"].isin(PROBE_DIMS)].copy()
                      cd_pivot = lw_cd.pivot_table(
                          index=["layer", "probe_dim"],
                          columns="mode", values="cohort_centroid_dist", aggfunc="first",
                      ).reset_index().sort_values(["layer", "probe_dim"])
                      cd_csv = out_dir / "layerwise_centroid_dist.csv"
                      cd_pivot.to_csv(cd_csv, index=False)
                      print(f"[layerwise] wrote {cd_csv}  rows={len(cd_pivot)} (centroid distance)")
                  else:
                      print("[layerwise] cohort_centroid_dist column missing from probe parquets; "
                            "skipping centroid_dist pivot (re-run probe with 2026-05-16 patch)")

              # ----- (5) Human-readable markdown summary -----
              # 2026-05-16: cohort_results_summary.md emit so a phone-readable
              # version of the load-bearing numbers is on disk before the GPU node
              # finishes. Lead with the LATENT table per project framing rule
              # (paper2_publication memory: hidden-state is the load-bearing
              # result, surface is a confirmation under lm_head compression).
              from datetime import datetime as _dt
              md_path = Path("/workspace/hypernets/PROSPECTUS/HyperPEFTNet_RQ2/paper2/cohort_results_summary.md")
              md_path.parent.mkdir(parents=True, exist_ok=True)

              FINAL_LAYER = 23  # Pythia-1.4B final transformer block (index 0 = embedding)
              PROBE_DISPLAY = {
                  "sentiment_goemo": "sentiment",
                  "politeness":      "politeness",
                  "self_focus":      "self_focus",
                  "curiosity":       "curiosity",
                  "expressiveness":  "expressiveness",
                  "tempo":           "tempo",
                  "anxiety":         "anxiety",
                  "warmth":          "warmth",
                  "hostility":       "hostility",
              }
              MODE_COLS = [MODE_TO_LABEL[m] for m in MODES]
              MODE_ROUTE = {
                  "M1": ("active",     "ON"),
                  "M2": ("active",     "OFF"),
                  "M3": ("force_zero", "ON"),
                  "M4": ("force_zero", "OFF"),
                  "M5": ("(none, vanilla LoRA)", "ON"),
                  "M6": ("(none, vanilla LoRA)", "OFF"),
              }
              MODE_NAME = {
                  "M1": "M1: HP-LoRA + Arditi",
                  "M2": "M2: HP-LoRA + no_Arditi",
                  "M3": "M3: Zero-Δ + Arditi",
                  "M4": "M4: Zero-Δ + no_Arditi",
                  "M5": "M5: Vanilla + Arditi",
                  "M6": "M6: Vanilla + no_Arditi",
              }

              def _fmt_signed(v):
                  """Render numeric values with explicit sign + 2dp; NaN -> em-dash."""
                  try:
                      x = float(v)
                  except Exception:
                      return "—"
                  if not np.isfinite(x):
                      return "—"
                  return f"{x:+.2f}"

              def _fmt_unsigned(v):
                  """Centroid distance is always >= 0; no explicit sign."""
                  try:
                      x = float(v)
                  except Exception:
                      return "—"
                  if not np.isfinite(x):
                      return "—"
                  return f"{x:.2f}"

              def _fmt_pct(v):
                  try:
                      x = float(v)
                  except Exception:
                      return "—"
                  if not np.isfinite(x):
                      return "—"
                  return f"{100.0 * x:.0f}%"

              def _row_for_layer_dim(pv, layer, dim, fmt=_fmt_signed):
                  if pv is None or pv.empty:
                      return ["—"] * len(MODE_COLS)
                  m = pv[(pv["layer"] == layer) & (pv["probe_dim"] == dim)]
                  if m.empty:
                      return ["—"] * len(MODE_COLS)
                  r = m.iloc[0]
                  return [fmt(r.get(col)) for col in MODE_COLS]

              lines = []
              lines.append("# Paper 2 Cohort Experiment — the GPU node high-memory GPU Production Results")
              lines.append("")
              lines.append(f"Generated: {_dt.now().isoformat(timespec='seconds')}")
              lines.append(f"OUT_ROOT: {os.environ.get('OUT_ROOT', '(unset)')}")
              lines.append("")
              lines.append("## Modes (6-mode 2x3 factorial)")
              lines.append("")
              lines.append("| Mode | Hypernet route | Arditi hook | Coherence (rage / empath) |")
              lines.append("|---|---|---|---|")
              for m in MODES:
                  label = MODE_TO_LABEL[m]
                  route, hook = MODE_ROUTE[label]
                  pc = per_mode_coherent.get(m) or {}
                  lines.append(
                      f"| {MODE_NAME[label]} | {route} | {hook} | "
                      f"{_fmt_pct(pc.get('rage'))} / {_fmt_pct(pc.get('empath'))} |"
                  )
              lines.append("")

              # Latent first (load-bearing) per framing rule.
              lines.append(f"## Latent — signed Hedges' g at final block (layer {FINAL_LAYER}), per-user")
              lines.append("")
              lines.append("Convention: + = correct cohort direction (per HIGH_COHORT_PER_MEASURE), "
                           "− = wrong, ≈ 0 = flat. NaN (—) for zero_delta and vanilla modes is the "
                           "correct answer (those configurations have no per-user channel, so per-user "
                           "variance is zero by construction — see cohort_centroid_dist section below "
                           "for the non-NaN comparator).")
              lines.append("")
              lines.append("| Probe | " + " | ".join(MODE_COLS) + " |")
              lines.append("|" + "---|" * (1 + len(MODE_COLS)))
              for dim in PROBE_DIMS:
                  vals = _row_for_layer_dim(pivot, FINAL_LAYER, dim, fmt=_fmt_signed)
                  lines.append(f"| {PROBE_DISPLAY[dim]} | " + " | ".join(vals) + " |")
              lines.append("")

              lines.append(f"## Latent — cohort-centroid distance at L{FINAL_LAYER} (non-NaN comparator)")
              lines.append("")
              lines.append("This measures |mean(rage hidden state) − mean(empath hidden state)| in the "
                           "probe's projection axis at the final block. Captures Arditi's cohort-level "
                           "shift even when per-user variance is zero.")
              lines.append("")
              lines.append("| Probe | " + " | ".join(MODE_COLS) + " |")
              lines.append("|" + "---|" * (1 + len(MODE_COLS)))
              for dim in PROBE_DIMS:
                  vals = _row_for_layer_dim(cd_pivot, FINAL_LAYER, dim, fmt=_fmt_unsigned)
                  lines.append(f"| {PROBE_DISPLAY[dim]} | " + " | ".join(vals) + " |")
              lines.append("")

              lines.append("## Surface — signed Hedges' g (rage vs empath, per-user means) at the 9-probe panel")
              lines.append("")
              lines.append("Convention: + = correct cohort direction (per HIGH_COHORT_PER_MEASURE), "
                           "− = wrong, ≈ 0 = flat.")
              lines.append("")
              lines.append("| Probe | " + " | ".join(MODE_COLS) + " |")
              lines.append("|" + "---|" * (1 + len(MODE_COLS)))
              for dim in PROBE_DIMS:
                  row = [_fmt_signed(surface[dim].get(col)) for col in MODE_COLS]
                  lines.append(f"| {PROBE_DISPLAY[dim]} | " + " | ".join(row) + " |")
              lines.append("")

              # Mean |g| for HP-LoRA modes at final layer (AUC-equivalent stand-in).
              def _mean_abs_g(pv, layer, mode_col):
                  if pv is None or pv.empty or mode_col not in pv.columns:
                      return float("nan")
                  sub = pv[pv["layer"] == layer]
                  vals = pd.to_numeric(sub[mode_col], errors="coerce").to_numpy()
                  vals = np.abs(vals[np.isfinite(vals)])
                  return float(vals.mean()) if vals.size else float("nan")
              m1_mean_abs = _mean_abs_g(pivot, FINAL_LAYER, "M1")
              m2_mean_abs = _mean_abs_g(pivot, FINAL_LAYER, "M2")

              lines.append("## Interpretation")
              lines.append("")
              lines.append(
                  "1. The hypernet's per-user delta is the only source of per-user latent "
                  "structure: only HP-LoRA modes (M1, M2) have non-NaN per-user latent g; vanilla "
                  "and zero-Δ modes are NaN throughout, which is the strongest possible evidence "
                  "that they have no per-user channel."
              )
              lines.append(
                  "2. The Arditi residual-stream hook is a cohort-level shifter, not a per-user "
                  "persona creator: cohort-centroid distance is large when Arditi is on "
                  "(M1, M3, M5) and small when off (M2, M4, M6), regardless of whether the "
                  "hypernet is active."
              )
              lines.append(
                  "3. Surface metrics confirm the latent story under lm_head compression: "
                  "HP-LoRA + Arditi shows correctly-signed surface cohort g; vanilla and zero-Δ "
                  "also shift surface cohort centroid under Arditi, but with no per-user signal "
                  "beneath."
              )
              lines.append(
                  f"4. HP-LoRA latent magnitude at L{FINAL_LAYER}: mean(|g|) across 9 probe dims = "
                  f"{_fmt_unsigned(m1_mean_abs)} (M1, Arditi ON) vs "
                  f"{_fmt_unsigned(m2_mean_abs)} (M2, Arditi OFF)."
              )
              lines.append(
                  "5. Net story: hypernet supplies the per-user channel, Arditi supplies the "
                  "cohort-level push; neither alone gets both per-user variance AND correctly-"
                  "signed cohort separation, which is exactly the joint claim Paper 2 makes."
              )
              lines.append("")

              lines.append("## Artifacts")
              lines.append("")
              lines.append("- surface_table1.csv (signed)")
              lines.append("- surface_table1_raw.csv (raw rage−empath for reference)")
              lines.append("- layerwise_table1.csv (signed)")
              lines.append("- layerwise_table1_raw.csv (raw for reference)")
              lines.append("- layerwise_centroid_dist.csv (non-NaN comparator)")
              lines.append("- paper2_cohort_analysis_pack.json (combined)")
              lines.append("")

              md_path.write_text("\n".join(lines))
              print(f"[md] wrote {md_path}")
              PY_TABLE1
                  RC=$?
                  set -e
                  if (( RC == 0 )); then
                    subitem_done "${MARK}"
                    phase_end_ok "phase5_cohort_table1" 1 1
                  else
                    phase_end_fail "phase5_cohort_table1" 1 0
                  fi
                fi
              fi

              # ===========================================================
              # Wrap-up
              # ===========================================================
              kill ${TELEM_PID} 2>/dev/null || true
              echo ""
              echo "=================================================================="
              echo "  m1_gpu-node_p2_cohort COMPLETE  $(date -Is)"
              echo "  OUT_ROOT  : ${OUT_ROOT}"
              echo "  FORUM_ROOT: ${FORUM_ROOT}"
              echo "  LAYERWISE : ${LAYERWISE_OUT}"
              echo "  COHORT_OUT: ${COHORT_OUT}"
              echo "=================================================================="
