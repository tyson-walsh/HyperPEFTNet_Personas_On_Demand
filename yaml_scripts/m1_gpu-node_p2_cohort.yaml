# ===========================================================================
# m1_gpu-node_p2_cohort.yaml
# Paper 2 cohort-separation 2x3 factorial experiment — the GPU node high-memory GPU.
#
# Goal: Clean 2x3 factorial test of cohort separation:
#   {HyperPEFT-LoRA, Zero-Δ, Vanilla LoRA} x {Arditi ON, Arditi OFF}.
#   6 modes total, each run on the SAME real-user pool (~500 rage + 500 empath
#   for surface forums; 200 rage + 200 empath for the layerwise probe).
#
# Two outputs per mode:
#   (a) Surface table  — per-user realized Hedges' g rage-vs-empath on
#       the 9 probe dims (sentiment_goemo, politeness, self_focus, curiosity,
#       expressiveness, tempo, anxiety, warmth, hostility).
#   (b) Layerwise table — per-layer hidden-state Hedges' g rage-vs-empath
#       on the same 9 probe dims (via layerwise_6mode_probe.py).
#
# Modes:
#   M1: HP-LoRA + Arditi ON
#   M2: HP-LoRA + Arditi OFF
#   M3: Zero-Δ + Arditi ON
#   M4: Zero-Δ + Arditi OFF
#   M5: Vanilla + Arditi ON
#   M6: Vanilla + Arditi OFF
#
# Output root: /data/hypernets/results/paper_2_m1_cohort
# (NEW directory; never touches /paper_2_m1).
#
# Naming: HyperPEFT-LoRA. Pythia-1.4B.
#
# Launch:
#   kubectl apply -f m1_gpu-node_p2_cohort.yaml -n default
# Monitor:
#   kubectl get pods -n default -l app=m1-gpu-node-p2-cohort
#   kubectl logs <pod-name> -n default --tail=200 -f
# ===========================================================================

apiVersion: batch/v1
kind: Job
metadata:
  name: m1-gpu-node-p2-cohort
  namespace: default
spec:
  activeDeadlineSeconds: 172800   # 2 days
  ttlSecondsAfterFinished: 7200
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: m1-gpu-node-p2-cohort
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 600

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      tolerations:
        - key: "node"
          operator: "Equal"
          value: "gpu-node"
          effect: "NoSchedule"

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - ANON-HIGHMEM-ACCELERATOR

      volumes:
        - name: home-vol
          nfs:
            server: 10.0.0.1
            path: /workspace
        - name: data10-vol
          nfs:
            server: 10.0.0.2
            path: /data
        - name: tmp-vol
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "32Gi"
        - name: progress
          nfs:
            server: 10.0.0.2
            path: /data/shared/k8s_progress_logs

      containers:
        - name: m1-p2-cohort
          image: ghcr.io/anonymous/hypernets-pip-slim:v19-arm64
          imagePullPolicy: Always
          terminationMessagePolicy: FallbackToLogsOnError

          resources:
            requests:
              nvidia.com/gpu: "1"
              memory: "256Gi"
              cpu: "16"
              ephemeral-storage: "60Gi"
            limits:
              nvidia.com/gpu: "1"
              memory: "480Gi"
              cpu: "23"
              ephemeral-storage: "120Gi"

          volumeMounts:
            - name: home-vol
              mountPath: /workspace
            - name: data10-vol
              mountPath: /data
            - name: tmp-vol
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
            - name: progress
              mountPath: /progress

          env:
            - name: TZ
              value: "EST5EDT,M3.2.0,M11.1.0/2"
            - name: UCX_HANDLE_ERRORS
              value: "bt"
            - name: UCX_ERROR_SIGNALS
              value: "SIGILL,SIGSEGV,SIGBUS,SIGFPE"
            - name: UCX_LOG_LEVEL
              value: "error"
            - name: PYTHONFAULTHANDLER
              value: "1"
            - name: CUDA_LAUNCH_BLOCKING
              value: "0"
            - name: CUDA_MODULE_LOADING
              value: "EAGER"
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
            - name: HF_HOME
              value: /data/.cache/huggingface
            - name: HUGGINGFACE_HUB_CACHE
              value: /data/.cache/huggingface/hub
            - name: TRANSFORMERS_CACHE
              value: /data/.cache/huggingface/transformers
            - name: HF_DATASETS_CACHE
              value: /data/.cache/huggingface/datasets
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: TOKENIZERS_PARALLELISM
              value: "true"
            - name: OMP_NUM_THREADS
              value: "16"
            - name: MKL_NUM_THREADS
              value: "16"
            - name: OPENBLAS_NUM_THREADS
              value: "16"
            - name: NUMEXPR_NUM_THREADS
              value: "16"
            - name: HN_DATALOADER_NUM_WORKERS
              value: "16"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True,max_split_size_mb:128"
            - name: HN_USE_UNIFIED_MEMORY
              value: "1"
            - name: CUDNN_FRONTEND_ATTN_DP_WORKSPACE_LIMIT
              value: "0"
            - name: TORCH_CUDNN_SDPA_ENABLED
              value: "0"
            # 2026-05-16: bug fix -- force bf16 + eager attn for Pythia-1.4B
            # on high-memory GPU. HyperPEFTLoRAEngine's model loader (build_hyperlora_forum.py
            # line 1636/1644) defaults to float16 + sdpa which causes cuDNN
            # crashes on this GPU. Without these env vars set BEFORE the python
            # process starts, the engine load itself silently picks the unsafe
            # defaults.
            - name: HN_TORCH_DTYPE
              value: "bfloat16"
            - name: HN_ATTN_IMPL
              value: "eager"
            - name: CUDA_MPS_PIPE_DIRECTORY
              value: "/tmp/nvidia-mps"
            - name: CUDA_MPS_LOG_DIRECTORY
              value: "/tmp/nvidia-mps-log"
            - name: NCCL_DEBUG
              value: "WARN"
            - name: TORCH_DISTRIBUTED_DEBUG
              value: "OFF"
            - name: PYTHONPATH
              value: "/workspace/hypernets/data_scripts:/workspace/hypernets/training_scripts"
            - name: CUBLAS_WORKSPACE_CONFIG
              value: ":4096:8"
            - name: PYTHONWARNINGS
              value: "ignore"
            - name: HF_HUB_OFFLINE
              value: "0"
            - name: TRANSFORMERS_OFFLINE
              value: "0"

          workingDir: /tmp
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -Eeuo pipefail
              umask 0002

              # ===========================================================
              # Paper 2 cohort 2x3 factorial — HyperPEFT-LoRA evaluation
              # ===========================================================

              JOB_TS="$(date +%Y%m%d_%H%M%S)"
              LOG_ROOT="/data/hypernets/log_files"
              MAIN_LOG="${LOG_ROOT}/m1_gpu-node_p2_cohort_${JOB_TS}.log"
              GPU_TELEM="${LOG_ROOT}/gpu_telem_m1_gpu-node_p2_cohort_${HOSTNAME}_${JOB_TS}.csv"

              mkdir -p /tmp/.cache /tmp/hf/hub /tmp/hf/transformers /tmp/hf/datasets
              mkdir -p /tmp/nvidia-mps /tmp/nvidia-mps-log || true
              mkdir -p "${LOG_ROOT}"

              exec > >(stdbuf -oL -eL tee -a "${MAIN_LOG}") 2>&1
              echo "[cohort] log  : ${MAIN_LOG}"
              echo "[cohort] host : ${HOSTNAME}"
              echo "[cohort] ts   : ${JOB_TS}"
              echo "[cohort] image: v19-arm64  gpu: high-memory GPU-480GB"

              echo 0 > /proc/sys/kernel/numa_balancing 2>/dev/null || true

              echo "timestamp,index,name,pstate,temperature.gpu,utilization.gpu,utilization.memory,memory.total,memory.free,memory.used" > "${GPU_TELEM}" || true
              (
                while true; do
                  nvidia-smi --query-gpu=timestamp,index,name,pstate,temperature.gpu,utilization.gpu,utilization.memory,memory.total,memory.free,memory.used \
                    --format=csv,noheader,nounits >> "${GPU_TELEM}" 2>/dev/null || true
                  sleep 30
                done
              ) &
              TELEM_PID=$!

              HF_TOKEN_FILE="/workspace/hypernets/HF_TOKEN.txt"
              if [[ -f "${HF_TOKEN_FILE}" ]]; then
                CLEAN_TOKEN="$(tr -d '[:space:]' < "${HF_TOKEN_FILE}")"
                if [[ -n "${CLEAN_TOKEN}" ]]; then
                  export HF_TOKEN="${CLEAN_TOKEN}"
                  export HUGGINGFACEHUB_API_TOKEN="${CLEAN_TOKEN}"
                  export HUGGINGFACE_HUB_TOKEN="${CLEAN_TOKEN}"
                fi
              fi

              [[ -f /venv/bin/activate ]] && source /venv/bin/activate || true

              if command -v nvidia-cuda-mps-control >/dev/null 2>&1; then
                echo "[mps] starting CUDA MPS daemon"
                nvidia-cuda-mps-control -d || true
                sleep 2
                echo get_server_list | nvidia-cuda-mps-control || true
                export HN_MPS_ENABLED=1
              else
                echo "[mps] single-stream"
                export HN_MPS_ENABLED=0
              fi

              # ===========================================================
              # Paths
              # ===========================================================
              SCRIPTS="/workspace/hypernets/training_scripts"
              DATA_SCRIPTS="/workspace/hypernets/data_scripts"
              DATA="/workspace/hypernets/data"
              MODELS_ROOT="/workspace/hypernets/models"

              HYPER_DIR="${HYPER_DIR:-${MODELS_ROOT}/hyperlora_gpu-node_M1_pythia14B_r24_full/hyperlora_multi}"
              VANILLA_LORA_DIR="${VANILLA_LORA_DIR:-${MODELS_ROOT}/vanillalora_M1_pythia14B}"
              BASE_MODEL="EleutherAI/pythia-1.4b"

              OUT_ROOT="${OUT_ROOT:-/data/hypernets/results/paper_2_m1_cohort}"
              FORUM_ROOT="${OUT_ROOT}/phase2_cohort_forums"
              LAYERWISE_OUT="${OUT_ROOT}/phase4_layerwise"
              COHORT_OUT="${OUT_ROOT}/phase5_cohort"
              STATE_FILE="${OUT_ROOT}/phase_state_cohort.json"

              mkdir -p "${OUT_ROOT}" "${FORUM_ROOT}" "${LAYERWISE_OUT}" "${COHORT_OUT}"

              # Pre-reg-locked inference parameters (mirror FULL_REFRESH)
              INJECT_CLAMP="0.020"
              DELTA_GAIN="8.0"
              MAX_NEW_TOKENS="192"
              TEMPERATURE="0.40"
              TOP_P="0.85"
              REPETITION_PENALTY="1.25"
              NO_REPEAT_NGRAM="4"
              MIN_NEW_TOKENS="30"
              LORA_R="24"
              LORA_ALPHA="48.0"
              LORA_DROPOUT="0.05"
              FANOUT="5,5,3,1"
              HORIZON_MIN="1080"
              N_RAGE="500"
              N_EMPATH="500"
              ARDITI_MODE="orthogonal"
              ARDITI_ALPHA="1.0"
              ARDITI_LAYERS="15-23"
              TARGET_MODULES="query_key_value,dense,dense_h_to_4h,dense_4h_to_h"

              # Arditi directions source (pre-staged from FULL_REFRESH cell).
              ARDITI_DIR_SRC="${OUT_ROOT_FULL_REFRESH:-/data/hypernets/results/paper_2_m1}/phase0b_arditi_directions_arditi"
              ARDITI_TMP="/tmp/arditi_directions.safetensors"

              declare -A FORUM_TOPIC
              FORUM_TOPIC["rage"]="unpopular opinions you actually believe"
              FORUM_TOPIC["empath"]="what's a piece of advice that stuck with you?"

              # ===========================================================
              # State / phase helpers (mirror FULL_REFRESH)
              # ===========================================================
              phase_state_init() {
                if [[ ! -f "${STATE_FILE}" ]]; then
                  echo "{}" > "${STATE_FILE}"
                fi
              }
              phase_state_get() {
                local pid="$1"
                python -c "
              import json, sys
              try:
                  s = json.load(open('${STATE_FILE}'))
              except Exception:
                  s = {}
              print((s.get('${pid}', {}) or {}).get('status', 'pending'))
              "
              }
              phase_state_set() {
                local pid="$1"; local status="$2"; local n_sub="${3:-0}"; local n_done="${4:-0}"
                python -c "
              import json, datetime, sys
              try:
                  s = json.load(open('${STATE_FILE}'))
              except Exception:
                  s = {}
              entry = s.get('${pid}', {}) or {}
              ts = datetime.datetime.utcnow().isoformat() + 'Z'
              if '${status}' == 'running' and 'started' not in entry:
                  entry['started'] = ts
              if '${status}' in ('completed', 'failed'):
                  entry['ended'] = ts
              entry['status'] = '${status}'
              entry['n_subitems'] = int(${n_sub})
              entry['n_complete'] = int(${n_done})
              s['${pid}'] = entry
              json.dump(s, open('${STATE_FILE}', 'w'), indent=2)
              "
              }
              phase_begin() {
                local pid="$1"; local n_sub="${2:-1}"
                phase_state_init
                local st; st="$(phase_state_get "${pid}")"
                if [[ "${st}" == "completed" ]]; then
                  echo "[state] phase ${pid} already completed; skipping."
                  return 1
                fi
                echo ""
                echo "================================================================"
                echo "  PHASE ${pid}  ($(date -Is))   resume_status=${st}"
                echo "================================================================"
                phase_state_set "${pid}" "running" "${n_sub}" "0"
                return 0
              }
              phase_end_ok() {
                local pid="$1"; local n_sub="${2:-1}"; local n_done="${3:-${n_sub}}"
                phase_state_set "${pid}" "completed" "${n_sub}" "${n_done}"
                echo "[state] phase ${pid} OK (${n_done}/${n_sub})"
              }
              phase_end_fail() {
                local pid="$1"; local n_sub="${2:-1}"; local n_done="${3:-0}"
                phase_state_set "${pid}" "failed" "${n_sub}" "${n_done}"
                echo "[state] phase ${pid} FAILED (${n_done}/${n_sub})"
              }
              subitem_done()    { touch "$1"; }
              subitem_is_done() { [[ -f "$1" ]]; }

              # ===========================================================
              # PHASE 0 -- always-on hot-stage
              # ===========================================================
              echo ""
              echo "================================================================"
              echo "  PHASE 0_STAGE ($(date -Is))   -- always runs"
              echo "================================================================"
              nvidia-smi -L || true
              python -c "
              import torch
              print('torch', torch.__version__, 'cuda?', torch.cuda.is_available())
              if torch.cuda.is_available():
                  print('device', torch.cuda.get_device_name(0))
                  print('VRAM', round(torch.cuda.get_device_properties(0).total_memory / 1e9, 1), 'GB')
              " || true

              echo "[phase0] staging data files to /tmp"
              for f in author_static_10000.parquet global_features_10000.parquet \
                       labels_sentiment_goemo.csv feature_norm_stats_10000.json \
                       train_data_10000.parquet goemo_labels_metadata.json \
                       labels_sentiment_goemo_extremes.csv \
                       labels_politeness.csv labels_self_focus.csv labels_tempo.csv \
                       labels_curiosity.csv labels_expressiveness.csv \
                       labels_anxiety.csv labels_warmth.csv labels_hostility.csv \
                       goemo_user_emotions.csv goemo_user_sentiment.csv; do
                if [[ -f "${DATA}/${f}" && ! -f "/tmp/${f}" ]]; then
                  cp "${DATA}/${f}" "/tmp/${f}" || true
                fi
              done

              # ===========================================================
              # PHASE 0_VALIDATE
              # ===========================================================
              if phase_begin "phase0_validate" 1; then
                REQUIRED=(
                  "${HYPER_DIR}/best/hypernetwork.safetensors"
                  "${HYPER_DIR}/best/peft_placeholders.safetensors"
                  "${DATA}/author_static_10000.parquet"
                  "${DATA}/feature_norm_stats_10000.json"
                  "${DATA}/labels_sentiment_goemo.csv"
                  "${ARDITI_DIR_SRC}/arditi_directions.safetensors"
                  "${SCRIPTS}/arditi_install_util.py"
                  "${SCRIPTS}/layerwise_6mode_probe.py"
                )
                MISSING=0
                for f in "${REQUIRED[@]}"; do
                  if [[ ! -e "$f" ]]; then
                    echo "[validate] MISSING: $f"
                    MISSING=$((MISSING + 1))
                  fi
                done
                if [[ ! -d "${VANILLA_LORA_DIR}" ]]; then
                  echo "[validate] WARNING: vanilla LoRA dir not found: ${VANILLA_LORA_DIR}"
                  echo "[validate] M5/M6 will be skipped if missing."
                fi
                if (( MISSING > 0 )); then
                  echo "[validate] ${MISSING} required input(s) missing; aborting."
                  phase_end_fail "phase0_validate" 1 0
                  exit 2
                fi
                phase_end_ok "phase0_validate" 1 1
              fi

              # ===========================================================
              # PHASE 0B_ARDITI_PRESTAGE  -- pre-stage Arditi directions
              # ===========================================================
              ARDITI_DIR_LOCAL="${OUT_ROOT}/phase0b_arditi_directions"
              mkdir -p "${ARDITI_DIR_LOCAL}"
              if phase_begin "phase0b_arditi_prestage" 1; then
                MARK="${ARDITI_DIR_LOCAL}/.complete"
                if subitem_is_done "${MARK}"; then
                  cp -f "${ARDITI_DIR_LOCAL}/arditi_directions.safetensors" "${ARDITI_TMP}"
                  phase_end_ok "phase0b_arditi_prestage" 1 1
                else
                  cp -f "${ARDITI_DIR_SRC}/arditi_directions.safetensors" \
                        "${ARDITI_DIR_LOCAL}/arditi_directions.safetensors"
                  cp -f "${ARDITI_DIR_SRC}/arditi_directions.json" \
                        "${ARDITI_DIR_LOCAL}/arditi_directions.json" 2>/dev/null || true
                  cp -f "${ARDITI_DIR_LOCAL}/arditi_directions.safetensors" "${ARDITI_TMP}"
                  if grep -qa 'persona/rage'   "${ARDITI_TMP}" \
                  && grep -qa 'persona/empath' "${ARDITI_TMP}"; then
                    subitem_done "${MARK}"
                    phase_end_ok "phase0b_arditi_prestage" 1 1
                  else
                    phase_end_fail "phase0b_arditi_prestage" 1 0
                    echo "[phase0b] FATAL: Arditi directions missing persona/* keys"
                    exit 2
                  fi
                fi
              fi

              # ===========================================================
              # Helper: run_cell <mode> <cohort>
              # ===========================================================
              # Dispatches the right script + flags for one factorial cell.
              # Cells write into ${FORUM_ROOT}/2_cohort_<mode>_<cohort>/.
              # ===========================================================
              run_cell() {
                local mode="$1"; local cohort="$2"
                local topic="${FORUM_TOPIC[${cohort}]}"
                local out="${FORUM_ROOT}/2_cohort_${mode}_${cohort}"
                local mark="${out}/.complete"
                mkdir -p "${out}/persona_signature"
                if subitem_is_done "${mark}"; then
                  echo "[skip] ${mode}/${cohort} already complete"
                  return 0
                fi

                case "${mode}" in
                  hp_lora_arditi|hp_lora_no_arditi|zero_delta_arditi|zero_delta_no_arditi)
                    # HyperPEFT-LoRA path. Zero-Δ adds --force_zero_delta.
                    # Arditi-on adds the 4 --arditi_* flags.
                    local extra=()
                    case "${mode}" in
                      zero_delta_*) extra+=( --force_zero_delta ) ;;
                    esac
                    # 2026-05-16: HP-LoRA path -- only install Arditi for the
                    # 2 truly-arditi modes (hp_lora_arditi, zero_delta_arditi).
                    # The bash glob *_arditi ALSO matches *_no_arditi, so use
                    # an explicit case list. We also pass --arditi_label_csv_dir
                    # explicitly (default is /tmp anyway, but be explicit so a
                    # future relocation of the label CSVs doesn't silently
                    # break the orthogonal-mode user routing).
                    case "${mode}" in
                      hp_lora_arditi|zero_delta_arditi)
                        extra+=( --arditi_patch "${ARDITI_TMP}" \
                                 --arditi_mode "${ARDITI_MODE}" \
                                 --arditi_alpha "${ARDITI_ALPHA}" \
                                 --arditi_layers "${ARDITI_LAYERS}" \
                                 --arditi_label_csv_dir /tmp ) ;;
                    esac
                    if python "${SCRIPTS}/build_hyperlora_forum.py" \
                        --author_parquet /tmp/author_static_10000.parquet \
                        --labels_csv /tmp/labels_sentiment_goemo.csv \
                        --base_model "${BASE_MODEL}" \
                        --online \
                        --hyper_dir "${HYPER_DIR}" \
                        --out_dir "${out}" \
                        --topic "${topic}" --sentiment_target "${cohort}" \
                        --threads_from_default 12 \
                        --target_modules "${TARGET_MODULES}" \
                        --lora_r "${LORA_R}" --lora_alpha "${LORA_ALPHA}" --lora_dropout "${LORA_DROPOUT}" \
                        --emit_both \
                        --inject_clamp "${INJECT_CLAMP}" --delta_gain "${DELTA_GAIN}" \
                        --fanout "${FANOUT}" --horizon_min "${HORIZON_MIN}" \
                        --n_rage "${N_RAGE}" --n_empath "${N_EMPATH}" \
                        --max_len 512 --max_new_tokens "${MAX_NEW_TOKENS}" \
                        --do_sample --top_p "${TOP_P}" --temperature "${TEMPERATURE}" \
                        --repetition_penalty "${REPETITION_PENALTY}" \
                        --no_repeat_ngram_size "${NO_REPEAT_NGRAM}" \
                        --min_new_tokens "${MIN_NEW_TOKENS}" \
                        --threshold_source /tmp/global_features_10000.parquet \
                        --threshold_col gstat_user_sent_mean \
                        --norm_stats_json /tmp/feature_norm_stats_10000.json \
                        --feature_clamp 3.0 --outlier_threshold 4.0 --filter_outliers \
                        --min_user_tokens 50 --seed 142 \
                        --infer_batch_size 16 \
                        "${extra[@]}"; then
                      subitem_done "${mark}"
                      return 0
                    else
                      echo "[run_cell] ${mode}/${cohort} FAILED"
                      return 1
                    fi
                    ;;
                  vanilla_arditi|vanilla_no_arditi)
                    if [[ ! -d "${VANILLA_LORA_DIR}" ]]; then
                      echo "[run_cell] vanilla LoRA dir missing; skipping ${mode}/${cohort}"
                      return 1
                    fi
                    local extra=()
                    # 2026-05-16: vanilla path -- only install Arditi for
                    # vanilla_arditi (NOT vanilla_no_arditi). Same bash glob
                    # caveat as the HP-LoRA path above.
                    case "${mode}" in
                      vanilla_arditi)
                        extra+=( --arditi_patch "${ARDITI_TMP}" \
                                 --arditi_mode "${ARDITI_MODE}" \
                                 --arditi_alpha "${ARDITI_ALPHA}" \
                                 --arditi_layers "${ARDITI_LAYERS}" \
                                 --arditi_label_csv_dir /tmp ) ;;
                    esac
                    if python "${SCRIPTS}/build_vanillalora_forum.py" \
                        --author_parquet /tmp/author_static_10000.parquet \
                        --labels_csv /tmp/labels_sentiment_goemo.csv \
                        --base_model "${BASE_MODEL}" \
                        --online --no_qlora \
                        --lora_dir "${VANILLA_LORA_DIR}" --use_best_ckpt \
                        --out_dir "${out}" \
                        --topic "${topic}" --sentiment_target "${cohort}" \
                        --threads_from_default 12 \
                        --fanout 5 5 3 1 --horizon_min "${HORIZON_MIN}" \
                        --n_rage "${N_RAGE}" --n_empath "${N_EMPATH}" \
                        --max_len 512 --max_new_tokens "${MAX_NEW_TOKENS}" \
                        --do_sample --top_p "${TOP_P}" --temperature "${TEMPERATURE}" \
                        --repetition_penalty "${REPETITION_PENALTY}" \
                        --no_repeat_ngram_size "${NO_REPEAT_NGRAM}" \
                        --seed 142 \
                        "${extra[@]}"; then
                      subitem_done "${mark}"
                      return 0
                    else
                      echo "[run_cell] ${mode}/${cohort} FAILED"
                      return 1
                    fi
                    ;;
                  *)
                    echo "[run_cell] unknown mode ${mode}"
                    return 1
                    ;;
                esac
              }

              # ===========================================================
              # PHASE 2_COHORT_6MODE  -- 12 cells (6 modes x 2 cohorts)
              # ===========================================================
              MODES_ALL="hp_lora_arditi hp_lora_no_arditi zero_delta_arditi zero_delta_no_arditi vanilla_arditi vanilla_no_arditi"
              N_CELLS=12
              if phase_begin "phase2_cohort_6mode" "${N_CELLS}"; then
                n_done=0
                for mode in ${MODES_ALL}; do
                  for cohort in rage empath; do
                    if run_cell "${mode}" "${cohort}"; then
                      n_done=$((n_done+1))
                    fi
                  done
                done
                (( n_done == N_CELLS )) \
                  && phase_end_ok "phase2_cohort_6mode" "${N_CELLS}" "${n_done}" \
                  || phase_end_fail "phase2_cohort_6mode" "${N_CELLS}" "${n_done}"
              fi

              # ===========================================================
