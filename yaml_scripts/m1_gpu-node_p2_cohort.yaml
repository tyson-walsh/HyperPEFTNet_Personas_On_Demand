                for mode in ${MODES_ALL}; do
                  out="${LAYERWISE_OUT}/layerwise_probe_${mode}.parquet"
                  mark="${LAYERWISE_OUT}/.${mode}.complete"
                  if subitem_is_done "${mark}"; then
